<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>Document chat</h1>
        <nav class="nav">
          <a href="/" class="current">Chat</a>
          <a href="/static/upload.html">Upload</a>
          <a href="/static/documents.html">Documents</a>
        </nav>
      </header>

      <div id="messages" class="messages">
        <p class="empty">Ask a question about the ingested documents.</p>
      </div>

      <form id="form" class="composer">
        <textarea
          id="input"
          rows="1"
          placeholder="Ask something&hellip;  (Enter to send, Shift+Enter for a new line)"
          autofocus
        ></textarea>
        <button id="send" type="submit">Send</button>
      </form>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
