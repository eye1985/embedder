[project]
name = "embeddings"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "auth0-fastapi>=1.0.0b12",
    "auth0-server-python>=1.0.0b1,<2",
    "fastapi>=0.141.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "langchain-openai>=1.6.0",
    "langchain-pymupdf4llm>=1.28.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "numpy>=2.5.2",
    "psycopg[binary,pool]>=3.3.4",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mlx-vlm>=0.6.4",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["test"]
# The project is run from its root, not installed, so `db`, `api` and `test`
# are only importable with the root on the path.
pythonpath = ["."]
# Integration tests need Postgres. They run against their own database so a
# run never touches development data -- see test/conftest.py.
addopts = "-q --strict-markers"
