[project]
name = "embeddings"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "docling-slim[standard]>=2.123.0",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.141.1",
    "langchain>=1.3.18",
    "langchain-docling>=3.0.0",
    "langchain-openai>=1.6.0",
    "langchain-postgres>=0.0.17",
    "langchain-pymupdf4llm>=1.28.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "psycopg[binary,pool]>=3.3.4",
    "tiktoken>=0.14.0",
    "tokenizers>=0.22.2",
    "transformers>=5.8.1",
]

[dependency-groups]
dev = [
    "mlx-vlm>=0.6.4",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["test"]
# The project is run from its root, not installed, so `db`, `api` and `test`
# are only importable with the root on the path.
pythonpath = ["."]
# Integration tests need Postgres. They run against their own database so a
# run never touches development data -- see test/conftest.py.
addopts = "-q --strict-markers"
